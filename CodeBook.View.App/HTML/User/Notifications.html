<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - CodeBook</title>
    <link  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<body>
    <div id ="navbar-placeholder"></div>
    <div class="container mt-4" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="text-white fw-bold mb-0">
            <i class="bi bi-bell-fill me-2" style="color:#7c3aed"></i>
            Notifications
        </h4>
        <div class="d-flex gap-3 align-items-center">
                <a href="../Posts/Feed.html" class="btn-purple">
                    <i class="fa-solid fa-arrow-left"></i> Back to Feed
                </a>
            </div>
        </div>
       <button id="clear-notifications" class="btn-purple">
        Mark all as read
        </button>
    </div>

    <div id="loading" class="text-center py-5 d-none">
        <div class="spinner-border"style="color:#7c3aed" ></div>
    </div>

    <div class="text-center py-5 d-none" id="no-notifications">
        <i class="bi bi-bell-slash fs-1 text-secondary"></i>
        <p class="text-secondary mt-3">You're all caught up!</p>
    </div>

    </div>
