<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBook Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">

            <a href="Feed.html" class="navbar-brand">
                <i class="fa-solid fa-code"></i>
                 CodeBook
            </a>

            <div class="d-flex gap-3 align-items-center">
                <a href="search.html" class="btn-purple">
                    <i class="fa-solid fa-search"></i> 
                    Search
                </a>

                <a href="Notifications.html" class="btn-purple">
                    <i class="fa-solid fa-bell"></i>
                </a>

                <a href="CreatePost.html" class="btn-purple">
                    <i class="fa-solid fa-plus"></i> 
                    New Post
                </a>
            </div>

        </div>
    </nav>

    
    <div class="container">
        <div id="postsContainer">
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <button id="prevBtn" class="btn-purple" onclick="changePage(-1)" style="display:none">
                ← Previous
             </button>
    
             <span id="pageNumber">Page 1</span>
    
             <button id="nextBtn" class="btn-purple" onclick="changePage(1)">
                  Next →
            </button>
        </div>
    </div>

    <script src="JS/api.js"></script>
    <script src="JS/Feed.js"></script>
</body>
</html>
