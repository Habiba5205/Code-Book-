<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - CodeBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a href="Feed.html" class="navbar-brand">
                <i class="fa-solid fa-code"></i> CodeBook
            </a>
            <div class="d-flex gap-3 align-items-center">
                <a href="Feed.html" class="btn-purple">
                    <i class="fa-solid fa-arrow-left"></i> Back to Feed
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 style="color:white; margin-bottom:20px">
            <i class="fa-solid fa-search"></i> Search CodeBook
        </h2>

        <!-- Search Box -->
        <div class="post-card mb-4">
            
            <!-- Main Search Input -->
            <div class="mb-3">
                <input type="text" id="searchInput" class="form-control" 
                       placeholder="Search for posts, users, or communities...">
            </div>

            <!-- Filter Type Tabs -->
            <div class="d-flex gap-2 mb-3">
                <button class="btn-purple active-filter" 
                        id="tab-posts" onclick="switchTab('posts')">
                    <i class="fa-solid fa-file-code"></i> Posts
                </button>
                <button class="btn-purple" 
                        id="tab-users" onclick="switchTab('users')">
                    <i class="fa-solid fa-user"></i> Users
                </button>
                <button class="btn-purple" 
                        id="tab-communities" onclick="switchTab('communities')">
                    <i class="fa-solid fa-people-group"></i> Communities
                </button>
            </div>

            <!-- Post Filters (shown when Posts tab active) -->
            <div id="postFilters" class="row g-3">
                <div class="col-md-5">
                    <select id="languageFilter" class="form-control">
                        <option value="">All Languages</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="Python">Python</option>
                        <option value="C#">C#</option>
                        <option value="C++">C++</option>
                        <option value="Java">Java</option>
                        <option value="TypeScript">TypeScript</option>
                        <option value="HTML">HTML</option>
                        <option value="CSS">CSS</option>
                        <option value="SQL">SQL</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <input type="text" id="tagFilter" class="form-control" 
                           placeholder="Filter by tag...">
                </div>
                <div class="col-md-2">
                    <button class="btn-purple w-100" onclick="search()">
                        <i class="fa-solid fa-search"></i> Search
                    </button>
                </div>
            </div>

            <!-- User/Community Filters (shown when Users or Communities tab active) -->
            <div id="otherFilters" style="display:none">
                <button class="btn-purple w-100" onclick="search()">
                    <i class="fa-solid fa-search"></i> Search
                </button>
            </div>
        </div>

        <!-- Results Count -->
        <div id="resultsCount" style="color:#bca1ec; margin-bottom:15px; display:none">
        </div>

        <!-- Results -->
        <div id="resultsContainer">
            <p style="color:#8b949e">Search for posts, users or communities above...</p>
        </div>
    </div>

    <script src="../../JS/api.js"></script>
    <script src="../../JS/Posts/Search.js"></script>
</body>
</html>
