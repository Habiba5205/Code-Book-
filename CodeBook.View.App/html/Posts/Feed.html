<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeBook Feed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../CSS/style.css">
    <style>
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: #161b22;
            border-right: 2px solid #7c3aed;
            z-index: 1000;
            transition: left 0.3s ease;
            padding: 20px;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .sidebar-overlay.open {
            display: block;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            transition: all 0.2s;
            margin-bottom: 8px;
            cursor: pointer;
            border: none;
            background: #21262d;
            width: 100%;
            text-align: left;
        }

        .sidebar-item:hover {
            background: #2d333b;
            color: #bca1ec;
            transform: translateX(4px);
        }

        .sidebar-item i {
            width: 20px;
            color: #7c3aed;
        }

        .sidebar-divider {
            border: none;
            border-top: 1px solid #30363d;
            margin: 15px 0;
        }

        .sidebar-logout {
            color: #f85149 !important;
        }

        .sidebar-logout i {
            color: #f85149 !important;
        }
    </style>
</head>

<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span style="color:white; font-weight:bold; font-size:16px">
                <i class="fa-solid fa-user" style="color:#7c3aed"></i> My Account
            </span>
            <button onclick="closeSidebar()" 
                    style="background:transparent; border:none; color:white; font-size:20px">
                ✕
            </button>
        </div>

        <a href="../User/UserProfile.html" class="sidebar-item">
            <i class="fa-solid fa-user"></i>
            My Profile
        </a>

        <a href="../Community/CommunityOwner.html" class="sidebar-item">
            <i class="fa-solid fa-people-group"></i>
            My Communities
        </a>

        <a href="../Community/Community.html" class="sidebar-item">
            <i class="fa-solid fa-globe"></i>
            Browse Communities
        </a>

        <a href="SavedPosts.html" class="sidebar-item">
            <i class="fa-solid fa-bookmark"></i>
            Saved Posts
        </a>

        <hr class="sidebar-divider">

        <button class="sidebar-item sidebar-logout" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>
    </div>

    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">

            <a href="Feed.html" class="navbar-brand">
                <i class="fa-solid fa-code"></i>
                 CodeBook
            </a>

            <div class="d-flex gap-3 align-items-center">
                <a href="Search.html" class="btn-purple">
                    <i class="fa-solid fa-search"></i> 
                    Search
                </a>

                <a href="../User/Notifications.html" class="btn-purple" id="notification-btn">
                    <span class="badge d-none"></span>
                    <i class="fa-solid fa-bell"></i>
                </a>

                <a href="../Posts/CreatePost.html" class="btn-purple">
                    <i class="fa-solid fa-plus"></i> 
                    New Post
                </a>

                <button class="btn-purple" onclick="openSidebar()">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

        </div>
    </nav>

    
    <div class="container">
        <div id="postsContainer">
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination">
            <button id="prevBtn" class="btn-purple" onclick="changePage(-1)" style="display:none">
                ← Previous
             </button>
    
             <span id="pageNumber">Page 1</span>
    
             <button id="nextBtn" class="btn-purple" onclick="changePage(1)">
                  Next →
            </button>
        </div>
    </div>

    <script>
    function openSidebar() {
        document.getElementById('sidebar').classList.add('open');
        document.getElementById('sidebarOverlay').classList.add('open');
    }

    function closeSidebar() {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('open');
    }

    function logout() {
        localStorage.clear();
        window.location.href = '../Auth/Login.html';
    }
    </script>

    <script type="module" src="../../JS/Posts/Feed.js" type="module"></script>
    <script type="module" src="../../JS/Interactions/Reactions.js" type="module"></script>
</body>
</html>
