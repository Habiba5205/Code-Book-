<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset = "UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>CodeBook - ForgotPassword</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">

</head>

<body>
  
    <nav class=" navbar px-4 py-3">
        <a class="navbar-brand">
            <i class="bi bi-code-slash"></i>
            CodeBook
        </a>
    </nav>
    <div class = "d-flex justify-content-center align-items-center" style="height: 90vh;">
        <div class="card p-4" style="width: 400px;">
            <h3 style="color:#ffffff">Create a new Password</h3>
             <hr style="border-color: #e3e9f1;">
       
        <div class="mb-3">
            <label class="form-label">Email address</label>
            <input
                type="email"
                class="form-control"
                id="email"
                placeholder="you@example.com"
                >
        </div>
                <div class="mb-3">
            <label class="form-label">New Password</label>
            <input
                type="password"
                class="form-control"
                id="password"
                placeholder="********"
                >
        </div>
                <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input
                type="password"
                class="form-control"
                id="confirmPassword"
                placeholder="********"
                >
        </div>
                <button class="btn w-100 mt-2"
                id="resetBtn"
                style="background-color:#7c3aed;
                color:white;">
                Confirm
                </button>
                   <hr style="border-color: #30363d;">
                <p class="text-center text-muted mb-0">
                    <a href="Login.html" 
                    style="color:#7c3aed;">Login</a>
                </p>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/forgotPassword.js" type="module"></script>
</body>
</html>
