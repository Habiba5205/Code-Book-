<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset = "UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>CodeBook - Login</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
   <link rel="stylesheet" href="../style.css">

</head>

<body>
  
    <nav class=" navbar px-4 py-3">
        <a class="navbar-brand">
            <i class="bi bi-code-slash"></i>
            CodeBook
        </a>
    </nav>
    <div class = "d-flex justify-content-center align-items-center" style="height: 90vh;">
        <div class="card p-4" style="width: 400px;">
            <h3>Welcome Back!</h3>
            <p style="color:#ffffff">Sign in to your account</p>
             <hr style="border-color: #30363d;">
       
        <div class="mb-3">
            <label class="form-label">Email address</label>
            <input
                type="email"
                class="form-control"
                id="email"
                placeholder="you@example.com"
                >
        </div>
                <div class="mb-3">
            <label class="form-label">Password</label>
            <input
                type="password"
                class="form-control"
                id="password"
                placeholder="********"
                >
        </div>
                <button class="btn w-100 mt-2"  id = "loginBtn"
                style="background-color:#7c3aed;
                color:white;">
                Sign In
                </button>
                   <hr style="border-color: #30363d;">
                <p style="color:#ffffff" class="text-center  mb-0" >
                    Don't have an account?
                    <a href="Register.html" 
                    style="color:#7c3aed;">Register</a>
                </p>
                 
                 <p class="text-center mt-1">
                 <a href="ForgotPassword.html" style="color: #7c3aed; font-size: 0.9rem;">Forgot password?</a>
                </p>
      </div>
    </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
     <script src="../JS/login.js" type="module" defer></script>


</body>
</html>
