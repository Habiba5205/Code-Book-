<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - CodeBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a href="Feed.html" class="navbar-brand">
                <i class="fa-solid fa-code"></i> CodeBook
            </a>
        </div>
    </nav>

    <div class="container">
        <h2 style="color:white; margin-bottom:20px">
            <i class="fa-solid fa-pen"></i> Create New Post
        </h2>

        <div class="post-card">
            
            <div class="mb-3">
                <label style="color:white">Title</label>
                <input type="text" id="title" class="form-control" 
                       placeholder="Enter post title">
            </div>

            <div class="mb-3">
                <label style="color:white">Body</label>
                <textarea id="body" class="form-control" rows="4" 
                          placeholder="What's on your mind?"></textarea>
            </div>

            <div class="mb-3">
                <label style="color:white">Code Snippet (optional)</label>
                <textarea id="codeSnippet" class="form-control" rows="6" 
                          placeholder="Paste your code here..." 
                          style="font-family:monospace"></textarea>
            </div>

            <div class="mb-3">
                <label style="color:white">Language</label>
                <select id="language" class="form-control">
                    <option value="">Select language</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Python">Python</option>
                    <option value="C#">C#</option>
                    <option value="C++">C++</option>
                    <option value="Java">Java</option>
                    <option value="TypeScript">TypeScript</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="SQL">SQL</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="mb-3 d-flex align-items-center gap-3">
                <label style="color:white">Public Post</label>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" 
                           id="isPublic" checked>
                </div>
            </div>

            <div id="errorMsg" class="error-msg"></div>

            <div id="successMsg" class="success-msg"></div>

            <button class="btn-purple" onclick="createPost()">
                <i class="fa-solid fa-paper-plane"></i> Publish Post
            </button>

            <a href="Feed.html" class="btn-purple ms-2">
                <i class="fa-solid fa-arrow-left"></i> Cancel
            </a>
        </div>
    </div>

    <script src="JS/api.js"></script>
    <script src="JS/CreatePost.js"></script>
</body>
</html>
