<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset = "UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>CodeBook - MY Profile</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
   <link rel="stylesheet" href="../style.css">
</head>

<body>
  
   <nav class="navbar px-4 py-3">

       <div class="d-flex align-items-center">
        <button
            class="btn btn-purple me-3"
            data-bs-toggle="offcanvas"
            data-bs-target="#sideMenu"
            aria-controls="sideMenu">
        <i class="bi bi-list fs-4"></i>
        </button>
        <a class="navbar-brand mb-0">
            <i class="bi bi-code-slash"></i>
            CodeBook
        </a>  
         </div>
    </nav>

    <div
    class="offcanvas offcanvas-start"
    tabindex="-1"
    id="sideMenu"
    aria-labelledby="sideMenuLabel">

    <div class="offcanvas-header">
        <h4 id="sideMenuLabel">
            <i class="bi bi-person-circle"></i>
            Menu
        </h4>

    <button
        type="button"
         class="btn-close btn-close-white"
        data-bs-dismiss="offcanvas">
    </button>
    </div>

    <div class="offcanvas-body">
    <div class="d-grid gap-2">
    <button class="menu-btn"
         onclick="showProfile()">
     <i class="bi bi-person"></i>
             Profile
    </button>
    <button class="menu-btn"
             onclick="showEdit()">
    <i class="bi bi-pencil-square"></i>
             Edit Profile
    </button>
    <button class="menu-btn"
             onclick="showPassword()">
    <i class="bi bi-key"></i>
             Reset Password
    </button>
    <button class="menu-btn"
             onclick="showPosts()">
    <i class="bi bi-grid"></i>
                My Posts
    </button>
     <button class="menu-btn"
             onclick="showSaved()">
     <i class="bi bi-bookmark"></i>
                Saved Posts
    </button>
    <button class="menu-btn"
            onclick="showFollowers()">
    <i class="bi bi-people"></i>
            Followers
    </button>
    <button class="menu-btn"
             onclick="showFollowing()">
     <i class="bi bi-person-plus"></i>
             Following
     </button>
        <button class="menu-btn"
         onclick="showNotification()">
     <i class="bi bi-bell"></i>
             Notifications
    </button>
       <button class="menu-btn"
         onclick="showCommunity()">
     <i class="bi bi-people-fill"></i>
             My Communities
    </button>       <button class="menu-btn"
         onclick="showdelete()">
     <i class="bi bi-trash"></i>
           Delete Account
    </button>
    </div>
    </div>
    </div>
    <div class="container mt-4">
     <div id="content" class="mx-auto" style="max-width:900px;">
    <div class="card p-4">
    <div class="row align-items-center">
    <div class="col-md-3 text-center">
     <img src="images/profile.png"
                 class="profile-img"
                 id="profileImage">
    </div>
    <div class="col-md-9">
    <h2 id="username">
                UserName</h2>
    <p class="bio-text" id="bio">Write your Bio....</p>
    <div class="d-flex gap-4 mb-3">
    <span>
    <strong id="followersCount">0</strong>
    <span> Followers</span>
    </span>
    <span>
    <strong id="followingCount">0</strong>
     <span> Following</span>
    </span>
    </div>
    </div>
    </div>
    </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
   <script type="module" src="../js/userProfile.js"></script>
</body>
</html>
