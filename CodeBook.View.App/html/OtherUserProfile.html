<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset = "UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>CodeBook - Other User Profile</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>

<body>
       <nav class="navbar px-4 py-3">
        <a class="navbar-brand mb-0">
            <i class="bi bi-code-slash"></i>
            CodeBook
        </a>  
         </div>
        </nav>
     <div class="container mt-5">
    <div class="card p-4">
    <div class ="row align-items-center">
    <div class ="col-md-3 text-center">
        <img 
        src = "../images/profile.png"
        id = "profileImage"
        class="profile-img">
    </div>
      <div class="col-md-9">
    <h2 id="username">UserName</h2>
     <p class="bio-text" id="bio">Write your Bio....</p>
        <span class ="me-5">
    <strong id="followersCount">0</strong>
    <span> Followers</span>
    </span>
     <span>
    <strong id="followingCount">0</strong>
     <span> Following</span>
    </span>
    </div>
   <div class="d-flex justify-content-center gap-3 mt-3">
    <button id = "followBtn"     class = "btn btn-purple">
                          Follow</button>
       <button id = "unfollowBtn"     class = "btn btn-purple">
                    UnFollow</button>
    </div>
    </div>
    </div>
    <div class = "mt-4">
        <h3>
            <i class = "bi bi-grid"></i>
        </h3>
        <div id = "postsContainer">

     </div>
    </div>
     </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="otherUserProfile.js"></script>
</body>
</html>
